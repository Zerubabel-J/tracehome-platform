# Local stand-in for CloudFront (decision 72): it picks where each request goes by its path.
# Local only: on AWS the built files go to the web bucket and CloudFront does this routing.
server {
    listen 80;
    root /usr/share/nginx/html;

    # /api/* -> the API (on AWS: VPC origin -> internal ALB -> ECS). The full path is passed on.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /photos/* -> the photos bucket (on AWS: Origin Access Control). The key keeps its photos/
    # prefix, because CloudFront passes the whole path to the bucket.
    location /photos/ {
        proxy_pass http://localstack:4566/tracehome-photos-local/photos/;
        expires 1d;
    }

    # Built JavaScript and CSS have content hashes in their names, so they can be cached for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else -> the website. Unknown paths such as /listings/42 get index.html so the
    # app's router can handle them. This rule applies to this location only, so a 404 from the
    # API stays a JSON 404. (On CloudFront: use a CloudFront Function on the default behavior,
    # not a distribution-wide custom error page, which would also replace the API's errors.)
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
