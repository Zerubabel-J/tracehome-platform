<style>
/* Layout: a blueprint sheet (the diagram) beside a presenter's notes column; tabs walk the journeys. */
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --sheet:#FFFFFF; --ink:#0F1B2D; --muted:#55627A; --line:#D5DBE5; --accent:#1D4ED8; --soft:#F5F7FA;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0C1220;--surface:#141C2E;--sheet:#FFFFFF;--ink:#E6EBF3;--muted:#9AA6BC;--line:#26314A;--accent:#7AA2FF;--soft:#1A2338;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1220;--surface:#141C2E;--sheet:#FFFFFF;--ink:#E6EBF3;--muted:#9AA6BC;--line:#26314A;--accent:#7AA2FF;--soft:#1A2338;color-scheme:dark}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 32px}
.wrap{max-width:1720px;margin:0 auto;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,2.4vw,30px);letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:2px 0 0;font-size:14px}
.hint{color:var(--muted);font-size:12.5px;font-family:var(--mono)}
kbd{font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
nav{display:flex;flex-wrap:wrap;gap:8px}
nav button{font:600 14px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .2s,border-color .2s}
nav button .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
nav button:hover{border-color:var(--c)}
nav button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
nav button[aria-pressed="true"] .dot{background:#fff}
nav button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
@media (max-width:1180px){.stage{grid-template-columns:minmax(0,1fr)}}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:12px;overflow-x:auto;padding:8px}
.sheet svg{display:block;width:100%;min-width:900px;height:auto}
#arch .el,#arch .always{transition:opacity .35s ease}
#arch .glow{animation:glow 1.1s ease-in-out infinite alternate}
@keyframes glow{from{filter:drop-shadow(0 0 0 rgba(0,0,0,0))}to{filter:drop-shadow(0 0 7px rgba(37,99,235,.9))}}
@media (prefers-reduced-motion:reduce){#arch .glow{animation:none;filter:drop-shadow(0 0 5px rgba(37,99,235,.9))}#arch .el{transition:none}}
aside{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;gap:0;overflow:hidden;min-width:0}
.jhead{padding:16px 18px;border-top:6px solid var(--c)}
.jhead .eyebrow{font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.jhead h2{font-family:var(--display);font-weight:700;font-size:22px;margin:2px 0 6px;text-wrap:balance}
.jhead p{margin:0;color:var(--muted)}
section.block{padding:14px 18px;border-top:1px solid var(--line)}
section.block h3{font:600 11.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ol.steps li{display:grid;grid-template-columns:38px minmax(0,1fr);gap:10px;padding:7px 8px;border-radius:8px;cursor:default}
ol.steps li[data-k]:not([data-k=""]){cursor:pointer}
ol.steps li:hover,ol.steps li:focus-visible{background:var(--soft)}
ol.steps li.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--c)}
ol.steps li.done .k{opacity:.55}
ol.steps li:focus-visible{outline:2px solid var(--accent)}
.k{font:600 12px var(--mono);color:#fff;background:var(--c);border-radius:999px;height:22px;display:grid;place-items:center;margin-top:1px}
.k.none{background:transparent;border:1px solid var(--line);color:var(--muted)}
ul.say{margin:0;padding-left:18px;display:grid;gap:6px}
details{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--soft)}
details+details{margin-top:8px}
summary{font-weight:600;cursor:pointer}
details p{margin:8px 0 2px;color:var(--ink)}
.pager{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.pager button{flex:1;font:600 13.5px var(--body);color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px;cursor:pointer}
.pager button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pager button:disabled{opacity:.45;cursor:default}
</style>

<text x="44" y="1642" font-size="11.5" fill="#334155" font-weight="700" text-anchor="start">B3</text>
<text x="72" y="1642" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">/photos/*: from the cache, or from the photos</text>
<text x="72" y="1657" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">bucket through OAC</text>
<text x="44" y="1678" font-size="11.5" fill="#334155" font-weight="700" text-anchor="start">B4</text>
<text x="72" y="1678" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">/api/*: through the private VPC origin to the</text>
<text x="72" y="1693" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">internal load balancer</text>
<text x="44" y="1714" font-size="11.5" fill="#334155" font-weight="700" text-anchor="start">B5</text>
<text x="72" y="1714" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">Load balancer → app in either zone → search in</text>
<text x="72" y="1729" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">PostgreSQL; the response returns the same way</text>
</g>
<g class="el j-u s-U1 s-U2 s-U3 s-U4">

<text x="395" y="1525" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="start">UNLOCKING A CONTACT</text>
<text x="395" y="1555" font-size="11.5" fill="#2563EB" font-weight="700" text-anchor="start">U1</text>
<text x="423" y="1555" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">Unlock request: CloudFront → VPC origin → load</text>

<text x="395" y="1591" font-size="11.5" fill="#2563EB" font-weight="700" text-anchor="start">U2</text>
<text x="423" y="1591" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">Decision: credits available and listing live?</text>
<text x="423" y="1606" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">If not, an error and nothing is spent</text>

<text x="423" y="1627" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">One transaction: credit, ledger, unlock, and</text>

<text x="423" y="1663" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">Response: the contact, shown at once</text>

<g class="el j-p s-P1 s-P2 s-P3 s-P4 s-P5 s-P6 s-P7 s-P8">
<rect x="732" y="1505" width="336" height="390" rx="10" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/>
<rect x="732" y="1505" width="336" height="30" rx="10" fill="#B45309"/><rect x="732" y="1525" width="336" height="10" fill="#B45309"/>
<text x="746" y="1525" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="start">UPLOADING A PHOTO</text>
<text x="746" y="1555" font-size="11.5" fill="#B45309" font-weight="700" text-anchor="start">P1</text>
<text x="774" y="1555" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">Request an upload link: CloudFront → load</text>
<text x="774" y="1570" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">balancer → app checks limits</text>
<text x="746" y="1591" font-size="11.5" fill="#B45309" font-weight="700" text-anchor="start">P2</text>
<text x="774" y="1591" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">Response: a presigned URL, valid for minutes</text>
<text x="746" y="1612" font-size="11.5" fill="#B45309" font-weight="700" text-anchor="start">P3</text>
<text x="774" y="1612" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">The browser uploads straight to the incoming</text>
<text x="774" y="1627" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">bucket. S3 answers "uploaded" at once; the</text>
<text x="774" y="1642" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">browser does not wait for the checks</text>
<text x="746" y="1663" font-size="11.5" fill="#B45309" font-weight="700" text-anchor="start">P4</text>
<text x="774" y="1663" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">GuardDuty scans the file; EventBridge sends</text>
<text x="774" y="1678" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">every scan result to the photo processing queue</text>
<text x="746" y="1699" font-size="11.5" fill="#B45309" font-weight="700" text-anchor="start">P5</text>
<text x="774" y="1699" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">The Lambda checks the result is a clean scan of</text>
<text x="774" y="1714" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">this exact object version. If not, it moves the</text>
<text x="774" y="1729" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">file to quarantine. Clean: Rekognition checks,</text>
<text x="774" y="1744" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">resize, remove GPS</text>
<text x="746" y="1765" font-size="11.5" fill="#B45309" font-weight="700" text-anchor="start">P6</text>
<text x="774" y="1765" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">Decision: approved? Yes: the cleaned photo goes</text>
<text x="774" y="1780" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">to the photos bucket. No: held for a moderator</text>
<text x="746" y="1801" font-size="11.5" fill="#B45309" font-weight="700" text-anchor="start">P7</text>
<text x="774" y="1801" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">Every result goes to the upload results queue.</text>
<text x="774" y="1816" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">A worker in either zone pulls it through NAT</text>
<text x="774" y="1831" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">and records it: approved, or a review case</text>
<text x="746" y="1852" font-size="11.5" fill="#B45309" font-weight="700" text-anchor="start">P8</text>
<text x="774" y="1852" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">Response: the app asks for the status: approved</text>
<text x="774" y="1867" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">or under review</text>
</g>
<g class="el j-d s-D1 s-D2 s-D3 s-D4">
<rect x="1083" y="1505" width="336" height="390" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
<rect x="1083" y="1505" width="336" height="30" rx="10" fill="#7C3AED"/><rect x="1083" y="1525" width="336" height="10" fill="#7C3AED"/>
<text x="1097" y="1525" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="start">DEPLOYING A CHANGE</text>
<text x="1097" y="1555" font-size="11.5" fill="#7C3AED" font-weight="700" text-anchor="start">D1</text>
<text x="1125" y="1555" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">A merge to main in GitHub starts CodePipeline</text>
<text x="1097" y="1576" font-size="11.5" fill="#7C3AED" font-weight="700" text-anchor="start">D2</text>
<text x="1125" y="1576" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">CodeBuild runs the tests and builds one image</text>
<text x="1097" y="1597" font-size="11.5" fill="#7C3AED" font-weight="700" text-anchor="start">D3</text>
<text x="1125" y="1597" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">The image is stored and scanned in ECR. ECR</text>

<text x="1097" y="1633" font-size="11.5" fill="#7C3AED" font-weight="700" text-anchor="start">D4</text>
<text x="1125" y="1633" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">CodePipeline's deploy stage updates the ECS</text>
<text x="1125" y="1648" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">services: new tasks in both AZs pull the image</text>

</g>
<g class="el j-r s-R1 s-R2 s-R3 s-R4">
<rect x="1434" y="1505" width="336" height="390" rx="10" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/>
<rect x="1434" y="1505" width="336" height="30" rx="10" fill="#0F766E"/><rect x="1434" y="1525" width="336" height="10" fill="#0F766E"/>
<text x="1448" y="1525" font-size="11.5" fill="#FFFFFF" font-weight="700" text-anchor="start">FAILURE AND RECOVERY</text>
<text x="1448" y="1555" font-size="11.5" fill="#0F766E" font-weight="700" text-anchor="start">R1</text>
<text x="1476" y="1555" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">RDS copies every change synchronously to the</text>
<text x="1476" y="1570" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">standby in zone B; failover is automatic; its</text>
<text x="1476" y="1585" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">duration varies</text>
<text x="1448" y="1606" font-size="11.5" fill="#0F766E" font-weight="700" text-anchor="start">R2</text>
<text x="1476" y="1606" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">Zone B runs its own app, workers, and NAT; ECS</text>
<text x="1476" y="1621" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">replaces lost tasks</text>
<text x="1448" y="1642" font-size="11.5" fill="#0F766E" font-weight="700" text-anchor="start">R3</text>
<text x="1476" y="1642" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">Dead-letter queues hold failed work; a</text>
<text x="1476" y="1657" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">scheduled job flags uploads stuck in checking;</text>
<text x="1476" y="1672" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">a CloudWatch alarm tells the team</text>
<text x="1448" y="1693" font-size="11.5" fill="#0F766E" font-weight="700" text-anchor="start">R4</text>
<text x="1476" y="1693" font-size="11.5" fill="#0F172A" font-weight="400" text-anchor="start">AWS Backup copies backups to a second Region</text>
</g></svg></div>

<script>
const J=[{"id": "overview", "key": "", "color": "#64748B", "name": "Overview", "lede": "One Region, two Availability Zones. Nothing inside the VPC can be reached from the internet. Read the top from top to bottom: internet, edge, public, app, data. The parts below are background work.", "steps": [["", "Edge: Route 53, CloudFront, and AWS WAF, on AWS\u2019s global network."], ["", "Serving requests, inside the VPC: public subnets hold only NAT; the app subnets hold the internal load balancer, the API, and the workers in both zones; the data subnets hold RDS PostgreSQL and its standby."], ["", "Queues: two SQS queues named by their jobs. The photo processing queue holds work waiting for the Lambda; the upload results queue holds decisions waiting to be recorded. Workers in both zones pull from it."], ["", "Checking uploads: nothing is published before it is scanned and checked. Documents go to a private, encrypted bucket for a moderator."], ["", "Analytics: Athena queries the logs in S3, never the live database."], ["", "Delivery and operations: how code reaches production, and what watches everything."]], "say": ["TraceHome has two products: a public marketplace that must be fast, and a private workspace that must be correct. The architecture follows from that split.", "The thick line is the core of TraceHome: browser \u2192 CloudFront \u2192 load balancer \u2192 app \u2192 PostgreSQL. Every journey starts at the browser, passes its decision points, and every response returns the same way."], "qa": [["Why one modular application instead of microservices?", "An unlock touches credits, listings, and leads in one all-or-nothing transaction, which is simple in one database. We are three people, so we don\u2019t have the team-scaling problem microservices solve. Module boundaries keep the option to split later."], ["Why us-east-1?", "Lowest prices and every service, with made-up data. Production will be chosen by measured latency from Addis Ababa and by legal advice: Cape Town, UAE, and Frankfurt are the candidates."]]}, {"id": "browse", "key": "b", "name": "Browsing", "color": "#334155", "steps": [["B1", "Route 53 answers with the nearest CloudFront edge's address"], ["B2", "HTTPS to that edge; WAF checks the request. The website files come from the cache or the web bucket"], ["B3", "/photos/*: from the cache, or from the photos bucket through OAC"], ["B4", "/api/*: through the private VPC origin to the internal load balancer"], ["B5", "Load balancer \u2192 app in either zone \u2192 search in PostgreSQL; the response returns the same way"]], "lede": "A seeker searches for homes. Route 53 only gives the address; CloudFront answers most requests from its cache and picks the origin by path for the rest.", "say": ["Public pages are cached for at most 60 seconds, because a removed listing must disappear within a minute. Anything that depends on who is asking is never cached.", "Search runs inside PostgreSQL at launch, so results are never out of date and there is nothing extra to run."], "qa": [["How do Route 53 and CloudFront work together?", "Route 53 is the phone book: it answers the name lookup once, with the address of the nearest CloudFront edge, and carries no traffic. CloudFront is the front desk: every request goes through it, WAF checks it, and it answers from cache or forwards by path: /api/* to the load balancer, /photos/* to the photos bucket, everything else to the web bucket."], ["Why not put the load balancer in a public subnet?", "Anyone could call it directly and bypass WAF. With a CloudFront VPC origin, the load balancer is internal and nothing in the VPC is reachable from the internet."], ["Why no OpenSearch?", "PostgreSQL full-text search and PostGIS cover launch. If search slows the database, a read replica comes first; a search service only when measurements require it."]]}, {"id": "unlock", "key": "u", "name": "Unlocking a contact", "color": "#2563EB", "steps": [["U1", "Unlock request: CloudFront \u2192 VPC origin \u2192 load balancer \u2192 app"], ["U2", "Decision: credits available and listing live? If not, an error and nothing is spent"], ["U3", "One transaction: credit, ledger, unlock, and the lead in the advertiser's workspace"], ["U4", "Response: the contact, shown at once"]], "lede": "A seeker spends a credit to see an advertiser\u2019s contact. Money must be exactly right, and the advertiser must get the lead.", "say": ["Credit, ledger entry, unlock, and lead are saved in one transaction: all of them happen, or none do.", "A unique constraint on seeker and listing means two taps at the same moment can\u2019t both spend a credit."], "qa": [["How does the advertiser learn about the lead, and what if the workers are down?", "The lead is saved in the same transaction as the unlock and appears in the advertiser\u2019s TraceHome workspace straight away. No background worker is involved, so nothing can be lost."], ["What about sending leads to an advertiser\u2019s CRM?", "Planned after launch. The unlock transaction would also write an outbox row, and a worker would deliver it through SQS with retries and a DLQ, so a crash or a CRM outage can\u2019t lose the lead."]]}, {"id": "upload", "key": "p", "name": "Uploading a photo", "color": "#B45309", "steps": [["P1", "Request an upload link: CloudFront \u2192 load balancer \u2192 app checks limits"], ["P2", "Response: a presigned URL, valid for minutes"], ["P3", "The browser uploads straight to the incoming bucket. S3 answers \"uploaded\" at once; the browser does not wait for the checks"], ["P4", "GuardDuty scans the file; EventBridge sends every scan result to the photo processing queue"], ["P5", "The Lambda checks the result is a clean scan of this exact object version. If not, it moves the file to quarantine. Clean: Rekognition checks, resize, remove GPS"], ["P6", "Decision: approved? Yes: the cleaned photo goes to the photos bucket. No: held for a moderator"], ["P7", "Every result goes to the upload results queue. A worker in either zone pulls it through NAT and records it: approved, or a review case"], ["P8", "Response: the app asks for the status: approved or under review"]], "lede": "An advertiser adds a listing photo. Nothing is published until it has been scanned and checked.", "say": ["Two responses are easy to confuse: \u201cuploaded\u201d comes back from S3 straight away, but \u201capproved\u201d comes only after the scan and the checks.", "Removing GPS data protects owners: a photo taken at home could otherwise reveal exactly where they live."], "qa": [["Why does the Lambda send results to a queue instead of updating the database?", "It runs outside the VPC with no database access, on purpose. A worker inside the VPC reads the result and updates the database, so the Lambda can never touch money or permissions."], ["How does a worker know there is a result to record?", "It pulls. Workers in both zones long-poll the queue. SQS hands each message to one worker and hides it for the visibility timeout; the worker deletes it only after writing to the database. If it crashes first, the message reappears for the other worker."], ["What happens to a photo that fails the content checks?", "It is never copied to the photos bucket. The Lambda moves it to held/, a worker opens a review case, and a moderator approves or rejects it. Held photos are kept 30 days, outside the 1-day deletion rule."], ["What if a file is replaced after it was scanned?", "The incoming bucket has versioning on, and the scan result names the version it scanned. The Lambda publishes only a clean scan of the current version, so a replaced file needs its own scan."], ["What if the scan fails or the file type is unsupported?", "It is treated like a threat. GuardDuty only reports and EventBridge only routes, so EventBridge sends every scan result to the queue and the Lambda moves the file to quarantine. A scheduled job flags any upload still checking after 30 minutes. A failure is never treated as approval."]]}, {"id": "deploy", "key": "d", "name": "Deploying a change", "color": "#7C3AED", "steps": [["D1", "A merge to main in GitHub starts CodePipeline"], ["D2", "CodeBuild runs the tests and builds one image"], ["D3", "The image is stored and scanned in ECR. ECR only stores it; it deploys nothing"], ["D4", "CodePipeline's deploy stage updates the ECS services: new tasks in both AZs pull the image and pass health checks"]], "lede": "A developer merges a change. It is tested, built once, and rolled out without downtime.", "say": ["The same image runs the API and the workers, so they can never disagree about the business rules.", "ECS starts new tasks, waits for health checks, then stops the old ones. If new tasks keep failing, the circuit breaker rolls back automatically."], "qa": [["Does pushing an image to ECR deploy it?", "No. ECR only stores and scans images. CodePipeline\u2019s deploy stage updates the ECS services, and ECS starts new tasks in both zones that pull the new image."], ["Where do secrets live? Not in the image?", "Never in the image. The database password is in Secrets Manager, and ECS hands it to the task at start-up."], ["Why CodePipeline and not GitHub Actions?", "It keeps the whole delivery path inside AWS, connected to GitHub without storing keys. GitHub Actions would also work."]]}, {"id": "recovery", "key": "r", "name": "Failure and recovery", "color": "#0F766E", "steps": [["R1", "RDS copies every change synchronously to the standby in zone B; failover is automatic; its duration varies"], ["R2", "Zone B runs its own app, workers, and NAT; ECS replaces lost tasks"], ["R3", "Dead-letter queues hold failed work; a scheduled job flags uploads stuck in checking; a CloudWatch alarm tells the team"], ["R4", "AWS Backup copies backups to a second Region"]], "lede": "What survives when something breaks, and how fast we recover.", "say": ["Multi-AZ is not a backup. A mistaken delete reaches the standby within milliseconds. Mistakes are undone with point-in-time recovery: back within an hour, losing at most 5 minutes.", "We test a restore before the demo and quote the real time it took."], "qa": [["Is active-active the right choice?", "For the app and workers, yes: they are stateless, both zones do real work, and a zone failure needs no switchover. The database stays active-passive, because money needs one source of truth."], ["Is Multi-AZ enough to protect the data?", "No. It protects against a zone failing. Backups with point-in-time recovery protect against mistakes, and cross-Region copies protect against losing the Region."], ["What happens if one NAT gateway fails?", "Only its zone loses outbound calls. The other zone has its own NAT gateway, and queued work waits until it is delivered."]]}];
const svg=document.getElementById('arch'), tabs=document.getElementById('tabs'), panel=document.getElementById('panel');
const els=[...svg.querySelectorAll('.el')];
let cur=0, step=-1;
J.forEach((j,i)=>{const b=document.createElement('button');b.type='button';b.id='tab-'+j.id;b.style.setProperty('--c',j.color);
  b.innerHTML='<span class="dot"></span>'+j.name;b.addEventListener('click',()=>go(i,-1));tabs.appendChild(b);});
function esc(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function paint(){
  const j=J[cur];
  if(!j.key){els.forEach(e=>{e.style.opacity=1;e.classList.remove('glow')});return;}
  const keys=j.steps.map(s=>s[0]); const upto=step<0?keys:keys.slice(0,step+1); const now=step<0?null:keys[step];
  els.forEach(e=>{const on=upto.some(k=>e.classList.contains('s-'+k)); e.style.opacity=on?1:.1;
    e.classList.toggle('glow',!!now&&e.classList.contains('s-'+now));});
  panel.querySelectorAll('li[data-i]').forEach(li=>{const i=+li.dataset.i; li.classList.toggle('on',i===step); li.classList.toggle('done',step>=0&&i<step);});
  const c=panel.querySelector('#count'); if(c) c.textContent=step<0?'Whole journey':'Step '+(step+1)+' of '+keys.length;
}
function go(i,s=-1,push=true){
  cur=(i+J.length)%J.length; step=s; const j=J[cur];
  [...tabs.children].forEach((b,n)=>b.setAttribute('aria-pressed',n===cur));
  panel.style.setProperty('--c',j.color);
  panel.innerHTML=
   `<div class="jhead"><div class="eyebrow">${cur===0?'Start here':'Journey '+cur+' of '+(J.length-1)} · <span id="count"></span></div><h2>${esc(j.name)}</h2><p>${esc(j.lede)}</p></div>`+
   `<section class="block"><h3>${cur===0?'What you are looking at':'Step by step · press → to reveal the next step'}</h3><ol class="steps">`+
     j.steps.map(([k,t],n)=>`<li ${k?`data-i="${n}" tabindex="0"`:''}><span class="k ${k?'':'none'}">${k||'·'}</span><span>${esc(t)}</span></li>`).join('')+`</ol></section>`+
   `<section class="block"><h3>Say this</h3><ul class="say">${j.say.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`+
   `<section class="block"><h3>Expect these questions</h3>${j.qa.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</section>`+
   `<div class="pager"><button type="button" id="prev">← Back</button><button type="button" id="all">Whole journey</button><button type="button" id="next">Next →</button></div>`;
  panel.querySelectorAll('li[data-i]').forEach(li=>{const f=()=>{step=+li.dataset.i;paint()}; li.addEventListener('click',f); li.addEventListener('keydown',e=>{if(e.key==='Enter')f()});});
  document.getElementById('prev').onclick=back; document.getElementById('next').onclick=next; document.getElementById('all').onclick=()=>{step=-1;paint()};
  paint();
  if(push){try{history.replaceState(null,'',j.id==='overview'?location.pathname+location.search:'#'+j.id)}catch(e){}}
}
function next(){const j=J[cur]; const n=j.key?j.steps.length:0; if(j.key&&step<n-1){step++;paint()} else go(cur+1,J[(cur+1)%J.length].key?0:-1);}
function back(){if(J[cur].key&&step>0){step--;paint()} else if(J[cur].key&&step===0){step=-1;paint()} else go(cur-1,-1);}
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('summary,input,textarea'))return;
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()} else if(e.key==='ArrowLeft'){back()} else if(/^[0-5]$/.test(e.key)){go(+e.key,-1)}});
function fromHash(){const h=location.hash.slice(1);const i=J.findIndex(j=>j.id===h);go(i<0?0:i,-1,false);}
window.addEventListener('hashchange',fromHash); fromHash();
</script>
